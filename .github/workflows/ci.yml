name: Check chess
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[test]'
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: .venv/bin/python -m pytest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check && bun run build
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: bun run test:ui
        working-directory: web
      - name: Validate both deployment definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.coolify.yaml config --quiet
      - name: Build and smoke-test the Coolify stack
        run: |
          docker compose -f compose.coolify.yaml up -d --build --wait --wait-timeout 120
          docker compose -f compose.coolify.yaml exec -T web wget -qO- http://127.0.0.1/api/health
          docker compose -f compose.coolify.yaml exec -T web wget -qO- --header='Content-Type: application/json' --post-data='{"moves":[],"difficulty":"easy"}' http://127.0.0.1/api/engine-move
      - name: Deployment logs
        if: failure()
        run: docker compose -f compose.coolify.yaml logs
      - name: Stop deployment smoke test
        if: always()
        run: docker compose -f compose.coolify.yaml down
